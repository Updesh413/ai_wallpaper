allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
    
    // Force all subprojects to use compileSdk 36 and assign namespace if missing
    project.plugins.whenPluginAdded { plugin ->
        if (plugin.class.name == "com.android.build.gradle.AppPlugin" || 
            plugin.class.name == "com.android.build.gradle.LibraryPlugin") {
            project.android {
                compileSdk = 36
                if (namespace == null) {
                    if (project.name == "flutter_wallpaper_manager") {
                        namespace = "com.pk.wallpapermanager.flutter_wallpaper_manager"
                    } else {
                        namespace = "com.plugin.${project.name.replace(':', '_').replace('-', '_')}"
                    }
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
