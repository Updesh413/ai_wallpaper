name: CI Pipeline

on:
  push:
    branches: [ main, master, redesign, 'feature/**' ]
  pull_request:
    branches: [ main, master, redesign ]
  workflow_dispatch:

jobs:
  analyze_and_test:
    name: Lint, Test & Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Create .env if missing
        run: |
          if [ ! -f .env ]; then
            echo "Creating placeholder .env for CI checks..."
            echo "PEXELS_API=${{ secrets.PEXELS_API || 'mock_pexels_api_key' }}" >> .env
            echo "FIREBASE_PROJECT_ID=ai-wallpaper-beb91" >> .env
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Formatting & Static Analysis
        run: flutter analyze

      - name: Run Test Suite
        run: flutter test --coverage

      - name: Build Debug APK (Build Verification)
        run: flutter build apk --debug
